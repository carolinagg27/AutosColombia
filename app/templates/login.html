{% extends 'base.html' %}
{% block titulo %}Iniciar sesión{% endblock %}
{% block contenido %}
<div class="tarjeta-login">
  <div class="login-icono">P</div>
  <h1>Autos Colombia</h1>
  <p class="texto-gris">Sistema de gestión de parqueadero</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label for="usuario" class="form-label">Usuario</label><input id="usuario" name="usuario" class="form-control" required autofocus maxlength="60" autocomplete="username" placeholder="Tu nombre de usuario"></div>
    <div class="mb-4"><label for="contrasena" class="form-label">Contraseña</label><input type="password" id="contrasena" name="contrasena" class="form-control" required autocomplete="current-password" placeholder="Tu contraseña"></div>
    <button class="btn btn-primario w-100">Iniciar sesión</button>
  </form>
  <small class="texto-gris d-block mt-4">Acceso exclusivo para personal autorizado</small>
</div>
{% endblock %}
